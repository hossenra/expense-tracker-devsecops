# Local/EC2 demo cluster: 1 control plane + 1 worker (fits a t3.medium).
# Host port 80 -> NodePort 30080, so the app opens at http://<EC2-IP>/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
  - role: worker
    image: kindest/node:v1.33.1
